name: agent-rag-doc-ui

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      VITE_RAG_API_BASE_URL: http://localhost:8000
      VITE_DOC_AGENT_API_BASE_URL: http://localhost:8001
